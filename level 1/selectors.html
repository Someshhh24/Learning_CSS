<!DOCTYPE html>
<html lang="en">
<head>
    <title>Selectors</title>
    <style>
        /*Group selector*/
        #heading, #heading_2{
            color: blue;
        }
        /*Id elector*/
        #heading{
            color: brown;
        }
        /*Element selector*/
        h3{
            color: red;
        }
        /*Class selector*/
        .para{
            color: rgb(23, 6, 151);
        }
    </style>
</head>
<body>
    <h1 id="heading">Heading</h1>
    <hr>
    <h2 id="heading_2">Lorem ipsum dolor sit amet consectetur, adipisicing elit. Eos, facilis.</h2>
    <hr>
    <p class="para">Lorem ipsum dolor sit amet consectetur adipisicing elit. Sit, non.</p>
    <h3>Lorem ipsum dolor sit, amet consectetur adipisicing elit. Possimus rem odit dolorem, magnam ducimus ullam nihil reprehenderit vero quo. Eveniet.</h3>
</body>
</html>
