<!DOCTYPE html>
<html lang="en">
<head>
    <title>practice set 1</title>
    <style>
        /*Here i am using the internal style but the css gives priority to the inline so it shows the inline style color in the browser*/
        #heading{
            color: chartreuse;
        }
        p{
            color: blue;
        }
        .heading_2{
            color: coral;
        }
        
        #second_heading{
            color: blue;
        }
        /*Group selector*/
        #first1,#second2{
            color: rgb(60, 0, 139);
        }
    </style>
</head>
<body>
    <h1 style="color: red;">This is the heading</h1>

    <div id="heading" style="color: black;">Lorem ipsum dolor sit amet.</div>

    <link rel="stylesheet" href="practice_set_1.css">

    <div id="second_heading">
        <p >Lorem ipsum dolor sit amet consectetur, adipisicing elit. Possimus, tempore.</p>
        <h2 class="heading_2">Lorem, ipsum dolor.</h2>
    </div>
    <div id="first1">Lorem ipsum dolor sit amet.</div>
    <div id="second2">Lorem ipsum dolor sit, amet consectetur adipisicing elit. Accusantium, officiis!</div>
</body>
</html>
