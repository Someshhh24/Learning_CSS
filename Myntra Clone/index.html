<!DOCTYPE html>
<html lang="en">
<head>
    <title>Myntra Clone</title>
    <link rel="stylesheet" href="index.css">
    <link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined" rel="stylesheet">
</head>
<body>
    <header>
        <div class="logo_container">
            <a href="#"><img class="Myntra_Home" src="Image/myntra_logo.webp" alt="Myntra_Home"></a>
        </div>
        <nav class="nav_bar">
            <a href="#">Men</a>
            <a href="#">Women</a>
            <a href="#">Kids</a>
            <a href="#">Home & Living</a>
            <a href="#">Beauty</a>
            <a href="#">Studio <sup>New</sup></a>
        </nav>

        <div class="search_bar">
            <span class="material-symbols-outlined search_icon">search</span> 
            <input class="search_input" type="text" placeholder="Search for products, brands and more">
        </div>


        <div class="action_bar">
            <div class="action_container">
                <span class="material-symbols-outlined action_icon">person</span>
                <span class="action_name">profile</span>
            </div>

             <div class="action_container">
               <span class="material-symbols-outlined action_icon">favorite</span>
                <span class="action_name">whishlist</span>
            </div>

             <div class="action_container">
                <span class="material-symbols-outlined action_icon">shopping_bag</span>
                <span class="action_name">bag</span>
            </div>

        </div>

    </header>

    <main>
        <div class="banner_container">
            <img src="Image/banner.jpg" alt="Main Banner" class="banner_image">
        </div>
        <div class="category_heading">Medal Worthy Brands To Bag</div>
        <div class="category_item">
            <a href="#"><img src="Image/Categories/1.png" class="sale_item"></a>
            <a href="#"><img src="Image/Categories/2.png" class="sale_item"></a>
            <a href="#"><img src="Image/Categories/3.png" class="sale_item"></a>
            <a href="#"><img src="Image/Categories/4.png" class="sale_item"></a>
            <a href="#"><img src="Image/Categories/5.png" class="sale_item"></a>
            <a href="#"><img src="Image/Categories/6.png" class="sale_item"></a>
            <a href="#"><img src="Image/Categories/7.png" class="sale_item"></a>
            <a href="#"><img src="Image/Categories/8.png" class="sale_item"></a>
            <a href="#"><img src="Image/Categories/9.png" class="sale_item"></a>
            <a href="#"><img src="Image/Categories/10.png" class="sale_item"></a>
            <a href="#"><img src="Image/Categories/11.png" class="sale_item"></a>
            <a href="#"><img src="Image/Categories/12.png" class="sale_item"></a>
        </div>

       <div class="category_heading">Medal Worthy Brands To Bag</div>
        <div class="category_item">
            <a href="#"><img src="Image/Discount/1.jpg" class="sale_item"></a>
            <a href="#"><img src="Image/Discount/2.jpg" class="sale_item"></a>
            <a href="#"><img src="Image/Discount/3.jpg" class="sale_item"></a>
            <a href="#"><img src="Image/Discount/4.jpg" class="sale_item"></a>
            <a href="#"><img src="Image/Discount/5.jpg" class="sale_item"></a>
            <a href="#"><img src="Image/Discount/6.jpg" class="sale_item"></a>
            <a href="#"><img src="Image/Discount/7.jpg" class="sale_item"></a>
            <a href="#"><img src="Image/Discount/8.jpg" class="sale_item"></a>
            <a href="#"><img src="Image/Discount/9.jpg" class="sale_item"></a>
            <a href="#"><img src="Image/Discount/10.jpg" class="sale_item"></a>
           
        </div>


    </main>


    <footer>
        <div class="footer_container">
            <div class="footer_column">
            <h3>ONLINE SHOPPING</h3>

            <a href="#">Men</a>
            <a href="#">Women</a>
            <a href="#">Kids</a>
            <a href="#">Home & Living</a>
            <a href="#">Beauty</a>
            <a href="#">Studio <sup>New</sup></a>
            </div>
        </div>
    </footer>
</body>
</html>
